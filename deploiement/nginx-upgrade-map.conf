# Bascule WebSocket, à poser dans /etc/nginx/conf.d/.
#
# Une connexion WebSocket commence par une requête HTTP portant
# `Upgrade: websocket`. Le proxy doit retransmettre `Connection: upgrade` pour
# ces requêtes-là, et `Connection: close` pour toutes les autres — sinon les
# requêtes ordinaires héritent d'un en-tête d'upgrade qui n'a pas lieu d'être.
#
# Cette `map` ne peut pas vivre dans un bloc `server` : nginx ne l'accepte que
# dans le bloc `http`, d'où ce fichier séparé.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
