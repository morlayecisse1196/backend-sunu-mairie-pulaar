[pytest]
# Tests unitaires SANS réseau (tests/). Les scripts test_*.py / verifier_*.py à
# la racine sont des vérifications manuelles contre les vrais services
# (Supabase, OpenRouter, Spaces HF) : volontairement exclus de la collecte.
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -q
